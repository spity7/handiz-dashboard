# Prerequisites:
#   1. cp server/.env.example server/.env  (fill secrets, keep active lines uncommented)
#   2. cp .env.example .env
#   3. docker compose up --build
#
# For production: swap commented/uncommented lines in .env files

services:
  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_ALLOWED_RETURN_ORIGINS: ${VITE_ALLOWED_RETURN_ORIGINS}
        VITE_HANDIZ_WEBSITE_URL: ${VITE_HANDIZ_WEBSITE_URL}
        VITE_LMS_SITE_URL: ${VITE_LMS_SITE_URL}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID}
    ports:
      - "127.0.0.1:3016:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./server
    ports:
      - "127.0.0.1:5016:5016"
    env_file:
      - ./server/.env
    volumes:
      - ./server/gcs-key.json:/app/gcs-key.json:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
